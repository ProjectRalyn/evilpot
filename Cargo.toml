[package]
name = "evilpot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["evilpot Contributors"]
description = "Embeddable zero-copy HTTP deception, exploit verification & tarpit honeypot crate for Rust WAFs and reverse proxies."
readme = "README.md"
keywords = ["honeypot", "deception", "tarpit", "waf", "security"]
categories = ["network-programming", "web-programming::http-server"]

[workspace]
resolver = "2"
members = [
    ".",
    "crates/evilpot-forefront",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["evilpot Contributors"]

[workspace.dependencies]
tokio = { version = "1.50", features = ["full"] }
bytes = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-layer = "0.3"
tower-service = "0.3"
axum = "0.8"
hyper = { version = "1.8", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
futures-core = "0.3"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
sigil-filter = "0.1"

[dependencies]
tokio.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rand.workspace = true
tracing.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tower.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
futures-core.workspace = true
sha2.workspace = true
base64.workspace = true
axum = { workspace = true, optional = true }

[features]
default = ["axum"]
axum = ["dep:axum"]

[[example]]
name = "axum_embed"
path = "examples/axum_embed.rs"
required-features = ["axum"]

